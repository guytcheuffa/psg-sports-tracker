[project]
name = "psg-tracker"
version = "0.1.0"
description = "Live Sports Tracker & xG Analytics for Paris Saint-Germain"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    # Versions figees (pas juste des bornes) : xgboost/shap/scikit-learn cassent
    # entre eux de facon subtile et non couverte par des bornes ">=" larges.
    # Verifie empiriquement : cette combinaison exacte fonctionne (train +
    # save/load + predict_proba + SHAP). Deux incompatibilites connues :
    #   - xgboost-cpu>=2.0.0,<3.0.0 requis pour shap<=0.49.1 (shap/shap#4288 :
    #     xgboost>=3.0 serialise base_score en tableau, shap ne le parse pas)
    #   - scikit-learn>=1.6 a remplace l'attribut de classe _estimator_type
    #     par __sklearn_tags__() ; les xgboost 2.x anterieurs a la 2.1.x ne
    #     s'y adaptent pas et plantent au predict_proba avec
    #     "TypeError: _estimator_type undefined". xgboost-cpu==2.1.4 gere le
    #     nouveau protocole de tags correctement.
    "xgboost-cpu==2.1.4",  # variante CPU-only (evite ~350MB de deps CUDA inutiles)
    "shap==0.49.1",
    "scikit-learn==1.7.2",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-requests",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
# AppTest (test_app.py) execute le script Streamlit dans un thread dedie
# (machinerie interne du ScriptRunner) : sans concurrency=thread, coverage.py
# ne trace que le thread principal et rapporte main.py comme non couvert
# alors qu'il l'est bien.
concurrency = ["thread"]
